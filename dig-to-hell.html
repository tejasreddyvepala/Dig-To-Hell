<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig to Hell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#23272d; --panel2:#2c3138; --line:#3a414b; --ink:#f1ede4; --muted:#a3a9b3;
  --hat:#ffcf3a; --good:#7ee08a; --bad:#ff7a5c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#23272d; --ink:#f1ede4; } }
:root[data-theme="dark"]{ --panel:#23272d; --ink:#f1ede4; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#191c20;color:var(--ink);font-family:'Rubik',system-ui,'Segoe UI',sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
#panel{width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.top{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.cash{font-family:'Bungee',Impact,sans-serif;font-size:38px;line-height:1;color:var(--hat)}
.sub{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:14px}
.sub b{color:var(--ink);font-weight:500}
.scroll{overflow-y:auto;padding:6px 14px 20px;flex:1}
h2{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:16px;margin:16px 6px 8px;color:var(--ink)}
.btn{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer;font:inherit}
.btn:hover:not(:disabled){border-color:var(--hat)}
.btn:focus-visible{outline:3px solid var(--hat);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.ic{font-size:26px;text-align:center}
.nm{font-weight:700;font-size:15px}
.ds{color:var(--muted);font-size:13px;margin-top:2px}
.pr{font-family:'Bungee',Impact,sans-serif;font-size:14px;color:var(--hat);text-align:right}
.ct{color:var(--muted);font-size:12px;text-align:right}
.disc{display:flex;justify-content:space-between;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px}
.disc span:last-child{color:var(--muted)}
.disc.locked span:first-child{color:var(--muted)}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,6,.62);z-index:5}
#modal.show{display:flex}
.card{background:var(--panel);border:2px solid var(--hat);border-radius:10px;padding:26px 28px;max-width:min(400px,88%);text-align:center}
.card .big{font-family:'Bungee',Impact,sans-serif;font-size:26px;line-height:1.15;margin:6px 0 10px}
.card p{color:var(--muted);margin:0 0 6px}
.card button{margin-top:16px;font:700 16px 'Rubik',system-ui,sans-serif;background:var(--hat);color:#2a2100;border:0;border-radius:6px;padding:12px 22px;cursor:pointer}
.card button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;margin:18px 6px 0;cursor:pointer;text-decoration:underline}
@media (max-width:760px){
  #app{flex-direction:column}
  #stage{flex:none;height:56%}
  #panel{width:100%;flex:1;border-left:0;border-top:1px solid var(--line)}
  .cash{font-size:30px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Mine shaft. Click to dig."></canvas>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
  <div id="panel">
    <div class="top">
      <div class="cash" id="cash">$0</div>
      <div class="sub"><span>Depth <b id="depth">0 m</b></span><span>Crew <b id="rate">$0/s</b></span></div>
    </div>
    <div class="scroll">
      <h2>Your tool</h2>
      <div id="tool"></div>
      <h2>Hire crew</h2>
      <div id="crew"></div>
      <h2>Finds</h2>
      <div id="finds"></div>
      <button class="reset" id="reset">Start over</button>
    </div>
  </div>
</div>
<script>
(()=>{
const LAYERS=[
  {name:'Topsoil',from:0,col:[122,84,52],ore:'#d9b26a',hard:1,val:1},
  {name:'Clay',from:25,col:[168,96,62],ore:'#e8d6a0',hard:1.5,val:3},
  {name:'Stone',from:80,col:[112,112,118],ore:'#c9d2dc',hard:2.5,val:8},
  {name:'Caves',from:200,col:[72,74,92],ore:'#8fd0ff',hard:4,val:20},
  {name:'Fossil beds',from:400,col:[150,132,96],ore:'#f3ead2',hard:6,val:50},
  {name:'Deep rock',from:800,col:[70,58,70],ore:'#c58cff',hard:10,val:130},
  {name:'Ancient ruins',from:1500,col:[96,104,80],ore:'#ffd76a',hard:16,val:350},
  {name:'Crystal caverns',from:2800,col:[44,60,96],ore:'#7ff7ff',hard:25,val:900},
  {name:'Magma',from:5000,col:[110,36,24],ore:'#ffb02e',hard:40,val:2500},
  {name:'Hell\'s crust',from:9000,col:[70,12,18],ore:'#ff4040',hard:65,val:7000},
  {name:'Below hell',from:15000,col:[20,10,30],ore:'#ffffff',hard:110,val:20000}
];
const TOOLS=[
  {name:'Bare hands',ic:'✋',pow:0.5,cost:0},
  {name:'Shovel',ic:'🥄',pow:1.5,cost:15},
  {name:'Pickaxe',ic:'⛏️',pow:4,cost:150},
  {name:'Jackhammer',ic:'🔨',pow:12,cost:1500},
  {name:'Drill rig',ic:'🛠️',pow:40,cost:16000},
  {name:'Plasma bore',ic:'⚡',pow:140,cost:180000},
  {name:'Antimatter drill',ic:'🌀',pow:520,cost:2.2e6}
];
const CREW=[
  {id:'dig',name:'Digger',ic:'👷',ds:'Swings a pick all day',rate:0.3,cost:40},
  {id:'cart',name:'Mine cart',ic:'🛒',ds:'Hauls dirt so diggers go faster',rate:1.6,cost:500},
  {id:'exc',name:'Excavator',ic:'🚜',ds:'A bucket the size of a car',rate:9,cost:6000},
  {id:'bore',name:'Tunnel borer',ic:'🔩',ds:'Chews through rock nonstop',rate:50,cost:80000},
  {id:'mole',name:'Mole robot',ic:'🤖',ds:'Never sleeps, never stops',rate:300,cost:1.1e6}
];
const FINDS=[
  {d:12,name:'A rusty coin',kind:'coin',side:1},
  {d:45,name:'A buried car',kind:'car',side:-1},
  {d:150,name:'An old mine cart',kind:'cart',side:1},
  {d:260,name:'An echoing cave',kind:'cave',side:-1},
  {d:450,name:'A T. rex skull',kind:'skull',side:1},
  {d:900,name:'A buried train',kind:'train',side:-1},
  {d:1600,name:'A lost temple',kind:'temple',side:1},
  {d:3000,name:'A giant crystal',kind:'crystal',side:-1},
  {d:5500,name:'A sea of magma',kind:'magma',side:1},
  {d:9500,name:'A door that knocks back',kind:'door',side:-1},
  {d:15000,name:'Whatever is below hell',kind:'eye',side:1}
];
const SAVE='digtohell_v1',PPM=12;
const hardAt=d=>Math.pow(1+d/20,2);
const valAt=d=>hardAt(d)*(1+d/1000);
const clickVal=()=>TOOLS[S.tool].pow*mult()*(1+S.depth/1000);

let S=fresh();
function fresh(){return{cash:0,depth:0,tool:0,crew:{dig:0,cart:0,exc:0,bore:0,mole:0},found:0,last:Date.now(),clicks:0}}
const layerAt=d=>{let L=LAYERS[0];for(const l of LAYERS)if(d>=l.from)L=l;return L};
const mult=()=>1+0.1*S.found;
const crewCost=c=>Math.ceil(c.cost*Math.pow(1.15,S.crew[c.id]));
const crewMps=()=>CREW.reduce((s,c)=>s+c.rate*S.crew[c.id],0)*mult();
const incomePerSec=()=>crewMps()*(1+S.depth/1000);
function fmt(n){
  if(n<10)return(Math.floor(n*10)/10).toString();
  if(n<1000)return Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}
  return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];
}
const money=n=>'$'+fmt(n);

// load + offline
let offline=null;
try{const raw=localStorage.getItem(SAVE);if(raw){const o=JSON.parse(raw);S=Object.assign(fresh(),o);S.crew=Object.assign(fresh().crew,o.crew||{});
  const secs=Math.min(8*3600,Math.max(0,(Date.now()-(o.last||Date.now()))/1000));
  if(secs>30&&crewMps()>0){const before=S.depth,c0=S.cash;advance(secs);offline={secs,dm:S.depth-before,dc:S.cash-c0}}
}}catch(e){}
function save(){S.last=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener('beforeunload',save);

function advance(secs){ // integrate crew digging in steps so layer changes are respected
  let left=secs;
  while(left>0){const dt=Math.min(left,1);const m=crewMps()/hardAt(S.depth)*dt;S.cash+=m*valAt(S.depth);S.depth+=m;left-=dt;checkFinds(true)}
}

// canvas
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
new ResizeObserver(resize).observe(cv);resize();

let parts=[],texts=[],shake=0,swing=0,banner=null,nugget=null,nuggetT=12,scrollOff=0,scrollIdle=0,t=0;
let lastLayer=layerAt(S.depth).name;
const hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pending=[];

function checkFinds(silent){
  while(S.found<FINDS.length&&S.depth>=FINDS[S.found].d){
    const f=FINDS[S.found];const bonus=Math.max(60,incomePerSec()*90,clickVal()*40);
    S.found++;S.cash+=bonus;
    if(!silent)pending.push({f,bonus});
  }
}

function faceY(){return H*0.64}
function viewTop(){return S.depth-faceY()/PPM+scrollOff}

function dig(px,py){
  if(nugget&&Math.hypot(px-nugget.x,py-nugget.y)<28){
    const b=Math.max(25,incomePerSec()*20,clickVal()*25);S.cash+=b;
    burst(nugget.x,nugget.y,'#ffd84a',24,260);texts.push({x:nugget.x,y:nugget.y-20,s:'Gold nugget +'+money(b),c:'#ffd84a',t:0,big:true});nugget=null;nuggetT=rnd(14,26);return;
  }
  const L=layerAt(S.depth);let m=TOOLS[S.tool].pow*mult()/hardAt(S.depth);let gain=m*valAt(S.depth);let lucky=Math.random()<0.04;
  if(lucky)gain*=10;
  S.depth+=m;S.cash+=gain;S.clicks++;swing=1;shake=Math.max(shake,lucky?6:2.5);
  const cx=W/2,fy=faceY()-scrollOff*PPM;
  burst(cx+rnd(-30,30),fy,rgb(L.col,1.25),lucky?22:9,lucky?240:150);
  if(lucky)burst(cx,fy,L.ore,14,220);
  texts.push({x:cx+rnd(-110,110),y:fy-30-rnd(0,40),s:(lucky?'Lucky strike +':'+')+money(gain),c:lucky?L.ore:'#f1ede4',t:0,big:lucky});
  scrollOff=0;
  checkFinds(false);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rgb=(c,k)=>'rgb('+c.map(v=>Math.max(0,Math.min(255,Math.round(v*k)))).join(',')+')';
function burst(x,y,col,n,sp){for(let i=0;i<n&&parts.length<500;i++){const a=rnd(-Math.PI,0),s=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.9),col,sz:rnd(2,5)})}}

cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();dig(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener('wheel',e=>{e.preventDefault();scrollOff=Math.min(0,scrollOff+e.deltaY/PPM*0.6);scrollOff=Math.max(-S.depth-40,scrollOff);scrollIdle=3},{passive:false});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat&&document.activeElement===document.body){e.preventDefault();dig(W/2,faceY())}});

// drawing helpers
function drawFind(f,x,y,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);
  const k=f.kind;
  if(k==='coin'){ctx.fillStyle='#d9a62e';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.fillStyle='#8a6414';ctx.fillRect(-2,-5,4,10)}
  else if(k==='car'){ctx.rotate(-.12);ctx.fillStyle='#8c3b22';ctx.fillRect(-40,-14,80,20);ctx.fillRect(-22,-28,44,16);ctx.fillStyle='#2a1e18';ctx.beginPath();ctx.arc(-24,8,9,0,7);ctx.arc(24,8,9,0,7);ctx.fill();ctx.fillStyle='#5b7f8f';ctx.fillRect(-18,-25,16,10);ctx.fillRect(2,-25,16,10)}
  else if(k==='cart'){ctx.fillStyle='#6b6f75';ctx.beginPath();ctx.moveTo(-26,-16);ctx.lineTo(26,-16);ctx.lineTo(20,8);ctx.lineTo(-20,8);ctx.closePath();ctx.fill();ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(-13,11,6,0,7);ctx.arc(13,11,6,0,7);ctx.fill()}
  else if(k==='cave'){ctx.fillStyle='#15161f';ctx.beginPath();ctx.ellipse(0,0,70,32,0,0,7);ctx.fill();ctx.fillStyle='#8fd0ff';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-50+i*25,-28);ctx.lineTo(-44+i*25,-10);ctx.lineTo(-38+i*25,-28);ctx.fill()}}
  else if(k==='skull'){ctx.fillStyle='#efe6cf';ctx.beginPath();ctx.ellipse(0,0,46,24,0,0,7);ctx.fill();ctx.fillRect(10,4,48,14);ctx.fillStyle='#3b3226';ctx.beginPath();ctx.arc(-14,-6,8,0,7);ctx.fill();ctx.fillStyle='#efe6cf';for(let i=0;i<6;i++)ctx.fillRect(14+i*7,16,4,9)}
  else if(k==='train'){ctx.fillStyle='#2f3a44';ctx.fillRect(-70,-20,140,36);ctx.fillStyle='#e7c46a';for(let i=0;i<5;i++)ctx.fillRect(-60+i*26,-12,16,12);ctx.fillStyle='#1b1b1b';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-50+i*33,18,8,0,7);ctx.fill()}}
  else if(k==='temple'){ctx.fillStyle='#b9b08a';ctx.fillRect(-60,-46,120,10);ctx.beginPath();ctx.moveTo(-66,-46);ctx.lineTo(0,-70);ctx.lineTo(66,-46);ctx.fill();for(let i=0;i<5;i++)ctx.fillRect(-54+i*26,-36,12,52);ctx.fillRect(-64,16,128,8)}
  else if(k==='crystal'){ctx.fillStyle='#7ff7ff';ctx.shadowColor='#7ff7ff';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(22,-10);ctx.lineTo(8,30);ctx.lineTo(-14,26);ctx.lineTo(-24,-14);ctx.closePath();ctx.fill();ctx.shadowBlur=0}
  else if(k==='magma'){const g=ctx.createRadialGradient(0,0,4,0,0,80);g.addColorStop(0,'#fff0a0');g.addColorStop(.4,'#ff8a1e');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,90,40,0,0,7);ctx.fill()}
  else if(k==='door'){ctx.fillStyle='#3a0b10';ctx.beginPath();ctx.moveTo(-26,30);ctx.lineTo(-26,-20);ctx.arc(0,-20,26,Math.PI,0);ctx.lineTo(26,30);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff4040';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#ff4040';ctx.beginPath();ctx.arc(12,4,3,0,7);ctx.fill()}
  else if(k==='eye'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,60,26,0,0,7);ctx.fill();ctx.fillStyle='#c01030';ctx.beginPath();ctx.arc(Math.sin(t)*14,0,18,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(Math.sin(t)*14,0,5,15,0,0,7);ctx.fill()}
  ctx.restore();
}
function figure(x,y,s,toolTier,ph,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle=col||'#2a2016';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,6);ctx.moveTo(0,6);ctx.lineTo(-7,20);ctx.moveTo(0,6);ctx.lineTo(7,20);ctx.stroke();
  ctx.fillStyle='#f0c79a';ctx.beginPath();ctx.arc(0,-22,7,0,7);ctx.fill();
  ctx.fillStyle='#ffcf3a';ctx.beginPath();ctx.arc(0,-24,8,Math.PI,0);ctx.fill();ctx.fillRect(-10,-25,20,3);
  const a=-1.1+ph*1.6;ctx.save();ctx.translate(0,-8);ctx.rotate(a);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(14,0);ctx.stroke();
  if(toolTier===1){ctx.strokeStyle='#8a5a2b';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(34,0);ctx.stroke();ctx.fillStyle='#9aa3ad';ctx.fillRect(32,-6,10,12)}
  if(toolTier>=2){ctx.strokeStyle='#8a5a2b';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(32,0);ctx.stroke();ctx.strokeStyle='#9aa3ad';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(26,-12);ctx.quadraticCurveTo(36,0,26,12);ctx.stroke()}
  ctx.restore();ctx.restore();
}
function drawMachine(tier,x,y,ph){
  ctx.save();ctx.translate(x,y);
  if(tier===3){const j=Math.sin(t*90)*1.5;figure(-26,-4,1,0,.5);ctx.fillStyle='#ffcf3a';ctx.fillRect(-12,-34+j,22,28);ctx.fillStyle='#9aa3ad';ctx.fillRect(-4,-6+j,6,16)}
  else if(tier===4){ctx.fillStyle='#d6a21e';ctx.fillRect(-46,-58,92,40);ctx.fillStyle='#3b3f45';ctx.fillRect(-36,-18,72,8);ctx.fillStyle='#9aa3ad';ctx.save();ctx.translate(0,-10);ctx.rotate(t*12);ctx.fillRect(-4,-4,8,8);ctx.restore();ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,-10);ctx.lineTo(0,14);ctx.fill()}
  else if(tier===5){ctx.fillStyle='#3a4250';ctx.fillRect(-50,-70,100,44);ctx.fillStyle='#7ff7ff';ctx.shadowColor='#7ff7ff';ctx.shadowBlur=18;ctx.fillRect(-6+Math.sin(t*40)*2,-26,12,36+ph*8);ctx.shadowBlur=0}
  else if(tier===6){ctx.fillStyle='#2a1f40';ctx.beginPath();ctx.arc(0,-50,34,0,7);ctx.fill();ctx.strokeStyle='#c58cff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-50,24+Math.sin(t*8)*4,0,7);ctx.stroke();ctx.fillStyle='#e3c8ff';ctx.shadowColor='#c58cff';ctx.shadowBlur=24;ctx.fillRect(-5,-18,10,30);ctx.shadowBlur=0}
  ctx.restore();
}
function drawCrew(cx,fy,shaftW){
  // each crew type shows one figure/machine plus a count
  const slots=[];
  CREW.forEach(c=>{if(S.crew[c.id]>0)slots.push(c)});
  const n=S.crew;let x=cx-shaftW/2+26;
  const step=Math.min(70,(shaftW-60)/Math.max(1,slots.length));
  slots.forEach((c,i)=>{
    const px=i%2===0?cx-shaftW/2+30+(i/2)*step:cx+shaftW/2-30-((i-1)/2)*step;
    const ph=(Math.sin(t*6+i)+1)/2;
    ctx.save();
    if(c.id==='dig'){figure(px,fy-20,.8,2,ph)}
    else if(c.id==='cart'){ctx.fillStyle='#6b6f75';ctx.fillRect(px-16,fy-26-ph*3,32,16);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(px-9,fy-8,5,0,7);ctx.arc(px+9,fy-8,5,0,7);ctx.fill();ctx.fillStyle=rgb(layerAt(S.depth).col,1.1);ctx.fillRect(px-14,fy-32-ph*3,28,7)}
    else if(c.id==='exc'){ctx.fillStyle='#f2b01e';ctx.fillRect(px-18,fy-30,30,18);ctx.fillStyle='#333';ctx.fillRect(px-20,fy-12,36,8);ctx.strokeStyle='#f2b01e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px+10,fy-26);ctx.lineTo(px+26,fy-40+ph*14);ctx.stroke();ctx.fillStyle='#8a8f96';ctx.fillRect(px+22,fy-40+ph*14,10,10)}
    else if(c.id==='bore'){ctx.fillStyle='#7d858f';ctx.fillRect(px-20,fy-34,40,26);ctx.save();ctx.translate(px,fy-6);ctx.rotate(t*10);ctx.fillStyle='#c9d2dc';for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.fillRect(-2,0,4,10)}ctx.restore()}
    else if(c.id==='mole'){ctx.fillStyle='#7a5cff';ctx.beginPath();ctx.arc(px,fy-18-ph*4,15,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-5,fy-21-ph*4,4,0,7);ctx.arc(px+5,fy-21-ph*4,4,0,7);ctx.fill()}
    ctx.restore();
    ctx.font="700 13px 'Rubik',system-ui,sans-serif";ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('×'+n[c.id],px,fy-48);
  });
}
function drawBase(cx,groundY){
  const total=Object.values(S.crew).reduce((a,b)=>a+b,0);
  const bx=cx+120;ctx.save();
  if(total<1){ctx.fillStyle='#4f6b3a';ctx.beginPath();ctx.moveTo(bx,groundY);ctx.lineTo(bx+30,groundY-40);ctx.lineTo(bx+60,groundY);ctx.fill()}
  else if(total<8){ctx.fillStyle='#7a5a3a';ctx.fillRect(bx,groundY-44,70,44);ctx.fillStyle='#5a3e26';ctx.beginPath();ctx.moveTo(bx-6,groundY-44);ctx.lineTo(bx+35,groundY-68);ctx.lineTo(bx+76,groundY-44);ctx.fill();ctx.fillStyle='#ffd76a';ctx.fillRect(bx+10,groundY-32,14,12)}
  else if(total<30){ctx.fillStyle='#8c949e';ctx.fillRect(bx,groundY-70,120,70);ctx.fillStyle='#ffcf3a';ctx.fillRect(bx,groundY-78,120,8);for(let i=0;i<4;i++){ctx.fillStyle='#ffd76a';ctx.fillRect(bx+10+i*28,groundY-56,16,14)}ctx.fillStyle='#3a414b';ctx.fillRect(bx+130,groundY-110,10,110);ctx.fillRect(bx+100,groundY-110,70,8)}
  else{ctx.fillStyle='#5c6672';ctx.fillRect(bx,groundY-150,90,150);ctx.fillStyle='#8c949e';ctx.fillRect(bx+90,groundY-90,110,90);for(let r=0;r<6;r++)for(let c=0;c<3;c++){ctx.fillStyle=hash(r*7+c)>.3?'#ffd76a':'#2b3138';ctx.fillRect(bx+12+c*26,groundY-140+r*22,14,12)}ctx.fillStyle='#ffcf3a';ctx.font="22px 'Bungee',Impact,sans-serif";ctx.textAlign='center';ctx.fillText('DIG CO',bx+145,groundY-60)}
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  const top=viewTop(),cx=W/2,shaftW=Math.min(320,W*0.42);
  const rows=Math.ceil(H/PPM)+2;const m0=Math.floor(top);
  const yOf=m=>(m-top)*PPM;
  // sky
  const gy=yOf(0);
  if(gy>0){const g=ctx.createLinearGradient(0,0,0,gy);g.addColorStop(0,'#6fb7e8');g.addColorStop(1,'#cfe9f7');ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);
    ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<4;i++){const x=((i*260+t*12)%(W+200))-100;ctx.beginPath();ctx.ellipse(x,gy*0.3+i*14,46,14,0,0,7);ctx.fill()}}
  // ground rows
  for(let i=0;i<rows;i++){
    const m=m0+i;if(m<0)continue;const y=yOf(m);const L=layerAt(m);
    const k=0.9+hash(m)*0.2;ctx.fillStyle=rgb(L.col,k);ctx.fillRect(0,y,W,PPM+1);
    if(hash(m*3.1)<0.5){ctx.fillStyle=rgb(L.col,0.75);ctx.fillRect(hash(m*5.7)*W,y,6+hash(m)*20,3)}
    if(hash(m*9.3)<0.07){const side=hash(m*2.2)<.5?-1:1;const ox=cx+side*(shaftW/2+30+hash(m*4.4)*(W/2-shaftW/2-60));ctx.fillStyle=L.ore;ctx.beginPath();ctx.ellipse(ox,y+3,7,4,0,0,7);ctx.fill()}
  }
  // grass
  if(gy>-20&&gy<H){ctx.fillStyle='#4f8a3a';ctx.fillRect(0,gy-6,W,10)}
  // shaft
  const sTop=Math.max(0,gy),sBot=yOf(S.depth);
  if(sBot>sTop){
    for(let i=0;i<rows;i++){const m=m0+i;if(m<0||m>=S.depth)continue;const y=yOf(m);const L=layerAt(m);ctx.fillStyle=rgb(L.col,0.42+hash(m)*0.06);ctx.fillRect(cx-shaftW/2,y,shaftW,PPM+1)}
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(cx-shaftW/2,sTop,8,sBot-sTop);ctx.fillRect(cx+shaftW/2-8,sTop,8,sBot-sTop);
    // ladder/rope
    ctx.strokeStyle='rgba(210,180,120,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-shaftW/2+18,sTop);ctx.lineTo(cx-shaftW/2+18,sBot);ctx.stroke();
    // depth markers
    ctx.font="600 12px 'Rubik',system-ui,sans-serif";ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,.55)';
    const stepM=S.depth>2000?500:S.depth>400?100:S.depth>80?25:10;
    for(let m=Math.ceil(Math.max(0,top)/stepM)*stepM;m<Math.min(S.depth,top+rows);m+=stepM){const y=yOf(m);ctx.fillRect(cx+shaftW/2-24,y,16,2);ctx.fillText(fmt(m)+' m',cx+shaftW/2+6,y+4)}
  }
  // finds (found ones in wall, the next one teased as a silhouette)
  FINDS.forEach((f,i)=>{const y=yOf(f.d);if(y<-120||y>H+120)return;const x=cx+f.side*(shaftW/2+110);
    if(i<S.found)drawFind(f,x,y,1);
    else if(i===S.found&&f.d-S.depth<40){drawFind(f,x,y,0.12+0.06*Math.sin(t*3));ctx.font="700 14px 'Rubik',system-ui,sans-serif";ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Something is down here…',x,y-50)}
  });
  if(gy>-200)drawBase(cx+shaftW/2,gy-4);
  // dig face + digger
  const fy=yOf(S.depth);
  if(fy>-80&&fy<H+80){
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(cx-shaftW/2,fy,shaftW,4);
    swing=Math.max(0,swing-0.12);
    if(S.tool<3)figure(cx,fy-22,1.15,S.tool,swing);else drawMachine(S.tool,cx,fy,swing);
    drawCrew(cx,fy,shaftW);
    if(nugget){nugget.x=cx+nugget.ox;nugget.y=fy+nugget.oy;ctx.fillStyle='#ffd84a';ctx.shadowColor='#ffd84a';ctx.shadowBlur=16+Math.sin(t*10)*6;ctx.beginPath();ctx.arc(nugget.x,nugget.y,12,0,7);ctx.fill();ctx.shadowBlur=0}
  }
  // particles + texts
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz)}ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const q of texts){ctx.globalAlpha=Math.max(0,1-q.t/1.2);ctx.font=(q.big?"22px 'Bungee',Impact,sans-serif":"700 16px 'Rubik',system-ui,sans-serif");ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(q.s,q.x+1,q.y+2);ctx.fillStyle=q.c;ctx.fillText(q.s,q.x,q.y)}ctx.globalAlpha=1;
  ctx.restore();
  // depth gauge
  const gx=W-26,gt=20,gh=H-40;const maxD=Math.max(60,FINDS[Math.min(S.found,FINDS.length-1)].d*1.15,S.depth*1.1);
  for(let i=0;i<LAYERS.length;i++){const a=LAYERS[i].from,b=i+1<LAYERS.length?LAYERS[i+1].from:maxD;if(a>maxD)break;ctx.fillStyle=rgb(LAYERS[i].col,1);ctx.fillRect(gx,gt+a/maxD*gh,10,(Math.min(b,maxD)-a)/maxD*gh+1)}
  ctx.fillStyle='#fff';ctx.fillRect(gx-6,gt+S.depth/maxD*gh-1,22,3);
  FINDS.forEach((f,i)=>{if(f.d>maxD)return;const y=gt+f.d/maxD*gh;ctx.font="700 11px 'Rubik',system-ui,sans-serif";ctx.textAlign='right';ctx.fillStyle=i<S.found?'#ffcf3a':'rgba(255,255,255,.75)';ctx.fillText(i<S.found?'★':'?',gx-6,y+4)});
  // layer banner
  if(banner){banner.t+=1/60;const a=Math.min(1,banner.t*3,Math.max(0,3-banner.t));ctx.globalAlpha=a;ctx.textAlign='center';ctx.font="34px 'Bungee',Impact,sans-serif";ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(banner.s,W/2+2,72);ctx.fillStyle='#ffcf3a';ctx.fillText(banner.s,W/2,70);ctx.font="500 15px 'Rubik',system-ui,sans-serif";ctx.fillStyle='#fff';ctx.fillText(banner.sub,W/2,96);ctx.globalAlpha=1;if(banner.t>3)banner=null}
  if(S.clicks<3&&!offline){ctx.textAlign='center';ctx.font="700 18px 'Rubik',system-ui,sans-serif";ctx.fillStyle='#fff';ctx.globalAlpha=.7+.3*Math.sin(t*4);ctx.fillText('Click anywhere to dig',W/2,yOf(S.depth)+60);ctx.globalAlpha=1}
  if(scrollOff<0){ctx.textAlign='center';ctx.font="600 14px 'Rubik',system-ui,sans-serif";ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText('Viewing the shaft. Click to jump back to the bottom',W/2,H-16)}
}

// panel
const $=id=>document.getElementById(id);
function buildPanel(){
  $('crew').innerHTML=CREW.map(c=>'<button class="btn" data-crew="'+c.id+'"><span class="ic" aria-hidden="true">'+c.ic+'</span><span><div class="nm">'+c.name+'</div><div class="ds">'+c.ds+'</div></span><span><div class="pr"></div><div class="ct"></div></span></button>').join('');
  document.querySelectorAll('[data-crew]').forEach(b=>b.onclick=()=>{const c=CREW.find(x=>x.id===b.dataset.crew);const cost=crewCost(c);if(S.cash>=cost){S.cash-=cost;S.crew[c.id]++;save();texts.push({x:W/2,y:faceY()-80,s:c.name+' hired',c:'#7ee08a',t:0,big:true})}});
}
buildPanel();
function updatePanel(){
  $('cash').textContent=money(S.cash);$('depth').textContent=fmt(S.depth)+' m';$('rate').textContent=money(incomePerSec())+'/s';
  const nt=TOOLS[S.tool+1],cur=TOOLS[S.tool];
  const th=nt?'<button class="btn" id="up"'+(S.cash<nt.cost?' disabled':'')+'><span class="ic" aria-hidden="true">'+nt.ic+'</span><span><div class="nm">Upgrade to '+nt.name+'</div><div class="ds">Dig '+(nt.pow/cur.pow).toFixed(1)+'× deeper per click</div></span><span><div class="pr">'+money(nt.cost)+'</div></span></button>':'<div class="ds" style="padding:0 6px">'+cur.ic+' '+cur.name+'. Nothing digs harder.</div>';
  if($('tool').dataset.k!==th){$('tool').innerHTML=th;$('tool').dataset.k=th;const u=$('up');if(u)u.onclick=()=>{const n=TOOLS[S.tool+1];if(n&&S.cash>=n.cost){S.cash-=n.cost;S.tool++;save();burst(W/2,faceY(),'#ffcf3a',30,260);banner={s:'New tool: '+n.name,sub:'Every click now earns about '+money(clickVal()),t:0}}}}
  document.querySelectorAll('[data-crew]').forEach((b,i)=>{const c=CREW[i];const cost=crewCost(c);
    const unlocked=i===0||S.crew[CREW[i-1].id]>0||S.cash>=c.cost*0.5;
    b.style.display=unlocked?'':'none';b.disabled=S.cash<cost;
    b.querySelector('.pr').textContent=money(cost);b.querySelector('.ct').textContent=S.crew[c.id]?'Own '+S.crew[c.id]:'';});
  const fh=FINDS.map((f,i)=>i<S.found?'<div class="disc"><span>★ '+f.name+'</span><span>'+fmt(f.d)+' m</span></div>':i===S.found?'<div class="disc locked"><span>? ? ?</span><span>'+fmt(f.d)+' m</span></div>':'').join('')+(S.found?'<div class="ds" style="padding:8px">Each find adds 10% to all digging. Now +'+(S.found*10)+'%</div>':'');
  if($('finds').dataset.k!==fh){$('finds').innerHTML=fh;$('finds').dataset.k=fh}
}
$('reset').onclick=()=>{if(confirm('Start over from the surface? This erases your progress.')){S=fresh();save();lastLayer='Topsoil';parts=[];texts=[]}};

// modal
let modalOpen=false;
function showModal(html,btn){$('card').innerHTML=html+'<button id="ok">'+btn+'</button>';$('modal').classList.add('show');modalOpen=true;$('ok').focus();$('ok').onclick=()=>{$('modal').classList.remove('show');modalOpen=false}}
if(offline){const h=Math.floor(offline.secs/3600),m=Math.floor(offline.secs%3600/60);
  showModal('<p>While you were away for '+(h?h+'h ':'')+m+'m</p><div class="big">Your crew dug '+fmt(offline.dm)+' m</div><p>and earned '+money(offline.dc)+'</p>','Get back to digging');}

// loop
let last=performance.now(),panelT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;t+=dt;
  const m=crewMps()/hardAt(S.depth)*dt;S.cash+=m*valAt(S.depth);S.depth+=m;checkFinds(false);
  const L2=layerAt(S.depth);if(L2.name!==lastLayer){lastLayer=L2.name;banner={s:L2.name,sub:'Rock gets harder, but every meter pays more',t:0}}
  if(pending.length&&!modalOpen){const p=pending.shift();showModal('<p>You hit something at '+fmt(p.f.d)+' m</p><div class="big">'+p.f.name+'</div><p>Sold for '+money(p.bonus)+'. All digging is now 10% faster.</p>','Keep digging');burst(W/2,faceY(),'#ffcf3a',40,300)}
  nuggetT-=dt;if(!nugget&&nuggetT<=0&&S.clicks>5){nugget={ox:rnd(-80,80),oy:rnd(10,40),life:4}}
  if(nugget){nugget.life-=dt;if(nugget.life<=0){nugget=null;nuggetT=rnd(14,26)}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.t+=dt;q.y-=40*dt;if(q.t>1.2)texts.splice(i,1)}
  shake=Math.max(0,shake-25*dt);
  if(scrollIdle>0){scrollIdle-=dt;if(scrollIdle<=0)scrollOff=0}
  render();
  panelT-=dt;if(panelT<=0){updatePanel();panelT=.12}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
