<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig to Hell</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="description" content="Dig a mine all the way to the Gates of Hell. Haul the rubble, press it into blocks, build ever-bigger buildings and sell them to dig deeper.">
<meta name="theme-color" content="#0d131c">
<style>
/* boot screen: the key art, inline so it shows before the game's CSS/JS arrive; main.ts fades it out after ≥ 2.5 s */
#boot{position:fixed;inset:0;z-index:100;background:#1a0a05;transition:opacity .5s}
#boot.out{opacity:0;pointer-events:none}
#boot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
#boot .bg{display:none}
@media (max-aspect-ratio:5/4){#boot .art{object-fit:contain} #boot .bg{display:block;filter:blur(22px) brightness(.5);transform:scale(1.15)}} /* portrait/narrow: the whole key art (title intact) over a blurred fill */
#boot .shade{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.65))}
#boot .bar{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(340px,62vw);height:10px;border-radius:5px;background:rgba(10,14,22,.85);border:1px solid rgba(255,220,120,.35);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffcf3a,#ff5a12);box-shadow:0 0 10px rgba(255,140,40,.7);animation:bootfill 2.5s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes bootfill{to{width:100%}}
@media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="boot" role="status" aria-label="Loading Dig to Hell"><img class="bg" src="loading.jpg" alt="" aria-hidden="true"><img class="art" src="loading.jpg" alt="" decoding="async" fetchpriority="high"><div class="shade"></div><div class="bar"><i></i></div></div>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Your mine. Click the rock to dig."></canvas>
    <nav id="nav" aria-label="Sites">
      <button class="site" data-site="mine"><span class="sic"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8edf2"/><stop offset=".55" stop-color="#9aa4ae"/><stop offset="1" stop-color="#5d666f"/></linearGradient><linearGradient id="gWood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb366"/><stop offset="1" stop-color="#b8601e"/></linearGradient></defs><path d="M17.6 11.4 7 28.6" stroke="#2a1608" stroke-width="5" stroke-linecap="round"/><path d="M17.6 11.4 7 28.6" stroke="url(#gWood)" stroke-width="3" stroke-linecap="round"/><path d="M4.5 11.5C9 4.5 19 2 28 8.2c-4.6-1.6-9.5-1.5-13.3.6-3.9 2-7.2 2.7-10.2 2.7z" fill="url(#gHead)" stroke="#1c2128" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="lbl">Mine</span><span class="badge" aria-hidden="true"></span></button>
      <button class="site" data-site="yard"><span class="sic"><svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="#0f3d18" stroke-width="1.4" stroke-linejoin="round"><path d="M13.2 4.6c1.5-2.4 4.1-2.4 5.6 0l3.4 5.6 2.4-1.4-1.5 7.2-7-2.2 2.4-1.4-2.5-4.3-3.4 5.6-4.4-2.7z" fill="#4cd964"/><path d="M27.6 18.6c1.4 2.5.1 4.7-2.7 4.8l-6.6.2v2.8l-5.4-5 5.3-5v2.8l5 .1-3.3-5.7 4.5-2.6z" fill="#34c158"/><path d="M6.5 25.8c-2.9 0-4.1-2.3-2.8-4.8l3.3-5.7-2.4-1.4 7-2.2 1.6 7.2-2.4-1.4-2.5 4.3 6.6.1v5.2z" fill="#26a84a"/></g></svg></span><span class="lbl">Yard</span><span class="badge" aria-hidden="true"></span></button>
      <button class="site" data-site="build"><span class="sic"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9.5 18 5.5l9 3.5v18.5L14 30 5 26.5z" fill="#2a1d10"/><path d="M6.5 10.2 18 6.8v21.6L6.5 25.6z" fill="#e3c39a"/><path d="M18 6.8l7.6 2.9v17.1L18 28.4z" fill="#b48a5c"/><path d="M6.5 10.2 18 6.8l7.6 2.9-11.4 3.6z" fill="#f6dfbd"/><path d="M10 14.5l4.3-1.2v13.4L10 25.4z" fill="#6b4a2a"/><path d="M20.3 13.2l3 1.1v3.6l-3-1.1z" fill="#9fd4f0"/></svg></span><span class="lbl">Build</span><span class="badge" aria-hidden="true"></span></button>
    </nav>
    <div id="hint" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="corner">
      <button id="menuBtn" aria-label="Menu" aria-expanded="false"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span><span class="clb">Menu</span></button>
      <button id="setBtn" aria-label="Sound settings" aria-expanded="false"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.6 2l.5 2.6c.7.2 1.3.5 1.9.9l2.4-1.2 2.3 2.3-1.2 2.4c.4.6.7 1.2.9 1.9l2.6.5v3.2l-2.6.5c-.2.7-.5 1.3-.9 1.9l1.2 2.4-2.3 2.3-2.4-1.2c-.6.4-1.2.7-1.9.9l-.5 2.6h-3.2l-.5-2.6c-.7-.2-1.3-.5-1.9-.9l-2.4 1.2-2.3-2.3 1.2-2.4c-.4-.6-.7-1.2-.9-1.9L2 13.6v-3.2l2.6-.5c.2-.7.5-1.3.9-1.9L4.3 5.6l2.3-2.3 2.4 1.2c.6-.4 1.2-.7 1.9-.9l.5-2.6zM12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2z"/></svg></span><span class="clb">Sound</span></button>
      <button id="ecoBtn" aria-label="Economy"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="4" height="8" rx="1" fill="#5fb4ff"/><rect x="10" y="8" width="4" height="13" rx="1" fill="#7ee05a"/><rect x="17" y="3" width="4" height="18" rx="1" fill="#ffcf3a"/><path d="M3 10l7-5 4 3 7-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="clb">Economy</span></button>
      <button id="achBtn" aria-label="Achievements"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gTro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#f2b018"/><stop offset="1" stop-color="#b8760a"/></linearGradient></defs><path d="M7 3h10v2h3.5v2.5c0 2.6-2 4.6-4.6 4.8A5.5 5.5 0 0 1 13 15.2V18h3v3H8v-3h3v-2.8a5.5 5.5 0 0 1-2.9-2.9C5.5 12.1 3.5 10.1 3.5 7.5V5H7zm-1.6 4v.5c0 1.3.8 2.4 2 2.8A8 8 0 0 1 7 7zm13.2 0h-1.6c0 1.1-.2 2.2-.6 3.3 1.3-.4 2.2-1.6 2.2-2.8z" fill="url(#gTro)" stroke="#5a3a06" stroke-width=".8" stroke-linejoin="round"/></svg></span><span class="clb">Trophies</span><span id="achBadge" hidden>0</span></button>
      <button id="tourBtn" aria-label="Take the tutorial"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.4L21 9.2l-4.9 4.3 1.5 6.5L12 16.6 6.4 20l1.5-6.5L3 9.2l6.4-.8z" fill="#7fd0ff" stroke="#1d4f7a" stroke-width=".8" stroke-linejoin="round"/></svg></span><span class="clb">Guide</span></button>
      <button id="helpBtn" aria-label="How to play"><span class="cic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4.1 2.6c-.8.4-1.3 1-1.3 1.9v.6" fill="none" stroke="#141c29" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.3" fill="#141c29"/></svg></span><span class="clb">Help</span></button>
    </div>
    <div id="settings" hidden>
      <label>Music <input type="range" id="volMusic" min="0" max="1" step="0.05"></label>
      <label>Sound effects <input type="range" id="volSfx" min="0" max="1" step="0.05"></label>
      <label class="chk"><input type="checkbox" id="mute"> Mute all</label>
      <button id="fsBtn" class="fsbtn" hidden>⛶ Fullscreen</button>
    </div>
    <div id="intro" hidden>
      <div id="introText"></div>
      <button id="introBtn" hidden>START DIGGING</button>
    </div>
    <div id="siteHud" aria-hidden="true">
      <div class="hudcard cur"><div class="hudk">Current Project</div><div class="hudrow"><b id="curName"></b></div>
        <div class="hudbar"><i id="curBar"></i><span id="curPct"></span></div><div class="hudsub" id="curMat"></div></div>
      <div class="hudcard next" id="nextCard"><div class="hudk">Next Project (Preview)</div><canvas id="nextImg" width="200" height="120"></canvas>
        <div class="hudrow"><b id="nextName"></b></div><div class="hudsub" id="nextVal"></div></div>
    </div>
    <div id="tourOffer" hidden role="dialog" aria-label="Tutorial">
      <b>New here?</b><span>A 1-minute tour of the mine, the yard and the money.</span>
      <div class="tobtns"><button id="tourOfferGo">Tour</button><button id="tourOfferNo" aria-label="No thanks">✕</button></div>
    </div>
    <div id="finale" hidden role="dialog" aria-modal="true"></div>
    <div id="achPops" aria-live="polite"></div>
    <div id="ecoPage" hidden role="dialog" aria-modal="true" aria-labelledby="ecoTitle">
      <div class="ecosheet">
        <div class="achhead">
          <div class="achht"><h2 id="ecoTitle">Economy</h2><div id="ecoLevel"></div></div>
          <div class="ecoinc"><b id="ecoIncome"></b></div>
          <button id="ecoClose" class="xclose" aria-label="Close economy">✕</button>
        </div>
        <div class="ecobody">
          <div id="ecoFlow" class="pipeline"></div>
          <div id="ecoTip" class="ecotip"></div>
        </div>
      </div>
    </div>
    <div id="achPage" hidden role="dialog" aria-modal="true" aria-labelledby="achTitle">
      <div class="achsheet">
        <div class="achhead">
          <div id="achRing" class="achring"><span class="cic">🏆</span></div>
          <div class="achht"><h2 id="achTitle">Achievements</h2><div id="achCount">0 of 50 unlocked</div></div>
          <div id="achTiers" class="achtiers"></div>
          <button id="achClaimAll" class="claimall" hidden></button>
          <button id="achClose" aria-label="Close achievements">✕</button>
        </div>
        <div class="achbody"><nav id="achTabs" class="achcats" aria-label="Categories"></nav><div id="achGrid" class="agrid"></div></div>
      </div>
    </div>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
  <div id="panel">
    <div class="top">
      <div class="cash" id="cash">$0</div>
      <div class="sub"><span>Depth <b id="depth">0 m</b></span><span id="siteName">Mine</span></div>
    </div>
    <div class="scroll">
      <button id="bestCard" class="bestcard" hidden><span class="bk">NEXT BEST UPGRADE</span><span class="bi"></span><span class="bn"></span><span class="bs"></span><span class="bp"></span><i class="fill" aria-hidden="true"></i></button>
      <!-- MINE -->
      <div class="sitepanel" id="p-mine" data-site="mine">
        <section class="acc" data-acc="m-ext">
          <button class="acc-h" aria-expanded="true"><span class="acc-t">Extraction</span><span class="stat" id="extStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b">
            <div class="status" id="extHint"></div>
            <div class="subh" id="subTool">⛏ Your pickaxe</div>
            <div id="tool"></div>
            <div class="subh" id="subCrew">👷 Your crew</div>
            <div id="crew"></div>
            <div id="gearCard"></div>
            <div id="workers"></div>
          </div>
        </section>
        <section class="acc" data-acc="m-site" id="g-site" hidden>
          <button class="acc-h" aria-expanded="false"><span class="acc-t">Worksite</span><span class="stat" id="siteStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div id="expandCard"></div><div id="excCard"></div><div id="sawCard"></div><div id="borerCard"></div></div>
        </section>
        <section class="acc" data-acc="m-tr" id="g-tr" hidden>
          <button class="acc-h" aria-expanded="false"><span class="acc-t">Transport</span><span class="stat" id="trStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div id="transport"></div></div>
        </section>
        <section class="acc" data-acc="m-finds">
          <button class="acc-h" aria-expanded="false"><span class="acc-t">Finds</span><span class="stat" id="findStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div id="finds"></div></div>
        </section>
      </div>
      <!-- YARD -->
      <div class="sitepanel" id="p-yard" data-site="yard" hidden>
        <section class="acc" data-acc="y-rec">
          <button class="acc-h" aria-expanded="true"><span class="acc-t">Recycling</span><span class="stat" id="recStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div class="status" id="yardHint"></div><div id="yardCard"></div><div id="processing"></div></div>
        </section>
        <section class="acc" data-acc="y-log" id="g-log" hidden>
          <button class="acc-h" aria-expanded="true"><span class="acc-t">Logistics</span><span class="stat" id="logStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div class="chips" id="logInfo"></div></div>
        </section>
      </div>
      <!-- BUILD -->
      <div class="sitepanel" id="p-build" data-site="build" hidden>
        <section class="acc" data-acc="b-proj">
          <button class="acc-h" aria-expanded="true"><span class="acc-t">Project</span><span class="stat" id="projStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b">
            <div class="proj">
              <div class="proj-h"><span id="projName"></span><span id="projValue"></span></div>
              <div class="bar"><i id="projBar"></i></div>
              <ol id="stages"></ol>
              <div class="bstate" id="buildState"></div>
              <button id="buildAct" class="act" hidden></button>
              <div class="chips" id="buildInfo"></div>
            </div>
          </div>
        </section>
        <section class="acc" data-acc="b-crew" id="g-crew" hidden>
          <button class="acc-h" aria-expanded="true"><span class="acc-t">Construction Crew</span><span class="stat" id="crewStat"></span><span class="chev" aria-hidden="true">▾</span></button>
          <div class="acc-b"><div id="crewCard"></div></div>
        </section>
      </div>
      <button class="reset" id="reset">Start over</button><span class="ver" id="ver"></span>
    </div>
  </div>
</div>
<div id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tourTitle">
  <div id="tourSpot"></div>
  <div id="tourBubble"><div class="tk"><span id="tourCount"></span><button id="tourSkip">Skip tutorial ✕</button></div>
    <h3 id="tourTitle"></h3><p id="tourText"></p>
    <div class="tnav"><button id="tourBack">‹ Back</button><button id="tourNext">Next ›</button></div></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
