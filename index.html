<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig to Hell</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Mine shaft. Click to dig."></canvas>
    <div id="nav"><button id="navBtn" hidden></button></div>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
  <div id="panel">
    <div class="top">
      <div class="cash" id="cash">$0</div>
      <div class="sub"><span>Depth <b id="depth">0 m</b></span><span>Yard <b id="stock">—</b></span></div>
    </div>
    <div class="scroll">
      <section class="acc" id="g-ext" data-acc="ext">
        <button class="acc-h" aria-expanded="true"><span class="acc-t">Extraction</span><span class="stat" id="extStat"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="acc-b">
          <div class="status" id="extHint"></div>
          <div id="tool"></div>
          <div id="crew"></div>
        </div>
      </section>
      <section class="acc" id="g-tr" data-acc="tr" hidden>
        <button class="acc-h" aria-expanded="false"><span class="acc-t">Transport</span><span class="stat" id="trStat"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="acc-b"><div id="transport"></div></div>
      </section>
      <section class="acc" id="g-proc" data-acc="proc" hidden>
        <button class="acc-h" aria-expanded="false"><span class="acc-t">Processing</span><span class="stat" id="procStat"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="acc-b"><div id="yardCard"></div><div id="processing"></div></div>
      </section>
      <section class="acc" id="g-finds" data-acc="finds">
        <button class="acc-h" aria-expanded="false"><span class="acc-t">Finds</span><span class="stat" id="findStat"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="acc-b"><div id="finds"></div></div>
      </section>
      <div id="debug"></div>
      <button class="reset" id="reset">Start over</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
