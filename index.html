<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig to Hell</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Mine shaft. Click to dig."></canvas>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
  <div id="panel">
    <div class="top">
      <div class="cash" id="cash">$0</div>
      <div class="sub"><span>Depth <b id="depth">0 m</b></span><span>Surface <b id="stock">0 rubble</b></span></div>
    </div>
    <div class="scroll">
      <section id="g-ext">
        <h2>Extraction</h2>
        <div id="tool"></div>
        <div id="crew"></div>
      </section>
      <section id="g-tr" hidden>
        <h2>Transport</h2>
        <div class="status" id="cartStatus"></div>
        <div id="transport"></div>
      </section>
      <section id="g-surf" hidden>
        <h2>Surface</h2>
        <div class="status" id="surfStatus"></div>
      </section>
      <h2>Finds</h2>
      <div id="finds"></div>
      <div id="debug"></div>
      <button class="reset" id="reset">Start over</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
